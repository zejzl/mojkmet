name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # `secrets` isn't a valid context in a step-level `if:` (GitHub rejects the whole
      # workflow file for it, not just the step) — go through a job-level env var instead.
      HAS_TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        if: env.HAS_TEST_DATABASE_URL == 'true'
        run: npm test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          # `next build` only needs DATABASE_URL to be *present* (lib/prisma.ts throws at
          # module load if it's unset) — it never runs a real query during the build, so the
          # test database's connection string is fine here and avoids a separate
          # DATABASE_URL secret (which was never actually configured on this repo).
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-only-secret
          PAYMENT_PROVIDER: mojkmet-mockpay
          PAYMENT_MOCK_BASE_URL: http://localhost:8787
          PAYMENT_MOCK_SECRET: ci-build-only-secret